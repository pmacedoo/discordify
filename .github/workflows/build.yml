name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python build.py
      - run: python tests/test_compression.py
      - run: python tests/test_encoding.py
      - run: python tests/test_drag.py
      - run: python tests/test_shell.py
      - uses: actions/upload-artifact@v4
        with:
          name: Discordify-Windows-x64
          path: dist/Discordify.exe
